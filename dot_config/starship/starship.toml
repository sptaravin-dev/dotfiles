# ~/.config/starship.toml


[character]
success_symbol = "[❯](#7E9CD8 bold)"   # Wave Blue
error_symbol   = "[❯](#C34043 bold)"   # Autumn Red

[cmd_duration]
style = "#C0A36E bold"  # Autumn Yellow (less neon than peach)

[directory]
style = "#D27E99"       # Sakura Pink
read_only = " 󰌾"

[git_branch]
style = "#7E9CD8"       # Wave Blue

[git_status]
style = "#FF9E64"       # Peach (stands out but not aggressive)

[hostname]
style = "#76946A"       # Autumn Green
ssh_symbol = " "


