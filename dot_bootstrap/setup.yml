---
- name: Dotfiles Bootstrap Setup
  hosts: localhost
  become: true
  connection: local
  vars:
    zsh_config_dir: "/home/{{ remote_regular_user }}/.config/zsh"

  tasks:
    - name: Get my user
      ansible.builtin.set_fact:
        remote_regular_user: "{{ ansible_env.SUDO_USER or ansible_user_id }}"

    - name: Install Packages
      ansible.builtin.apt:
        name:
          - curl
          - git
          - gnupg2
          - pinentry-curses
          - unzip
          - zsh
          - wget
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Change shell to zsh
      ansible.builtin.user:
        name: "{{ remote_regular_user }}"
        shell: /usr/bin/zsh

    - name: Install Nushell (Debian-based only)
      block:
        - name: Add the Nushell GPG key
          ansible.builtin.get_url:
            url: https://apt.fury.io/nushell/gpg.key
            dest: /etc/apt/trusted.gpg.d/fury-nushell.gpg
            mode: '0644'

        - name: Add the Nushell APT repository
          ansible.builtin.apt_repository:
            repo: "deb https://apt.fury.io/nushell/ /"
            filename: fury
            state: present

        - name: Update apt cache after adding Nushell repo
          ansible.builtin.apt:
            update_cache: yes
            cache_valid_time: 3600

        - name: Install Nushell
          ansible.builtin.apt:
            name: nushell
            state: present
      when: ansible_facts['os_family'] == "Debian"
      tags: [nushell]

