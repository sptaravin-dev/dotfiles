---
- name: Dotfiles Bootstrap Setup for Debian
  hosts: localhost
  become: true
  connection: local
  vars:
    zsh_config_dir: "/home/{{ remote_regular_user }}/.config/zsh"
  tasks:
    - name: Get my user
      ansible.builtin.set_fact:
        remote_regular_user: "{{ ansible_env.SUDO_USER or ansible_user_id }}"
    - name: Install Packages
      ansible.builtin.apt:
        name:
          - curl
          - git
          - gnupg2
          - pinentry-curses
          - unzip
          - zsh
          - wget
          - build-essential
          - clang
          - make  
          - libssl-dev
          - zlib1g-dev
          - libbz2-dev
          - libreadline-dev
          - libsqlite3-dev
          - llvm
          - libncursesw5-dev
          - xz-utils
          - tk-dev
          - libxml2-dev
          - libxmlsec1-dev
          - libffi-dev
          - liblzma-dev
          - bat
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Create symlink from /usr/bin/batcat to /usr/local/bin/bat
      file:
        src: /usr/bin/batcat
        dest: /usr/local/bin/bat
        state: link
        force: true
      when: ansible_os_family == "Debian"

    - name: Change shell to nushell
      ansible.builtin.user:
        name: "{{ remote_regular_user }}"
        shell: /usr/bin/nu

    - name: Create SSH key
      block:
        - name: create .ssh directory if needed
          ansible.builtin.file:
            path: /home/{{ remote_regular_user }}/.ssh
            state: directory
            mode: '0700'
            owner: "{{ remote_regular_user }}"
            group: "{{ remote_regular_user }}"

        - name: gen SSH key
          community.crypto.openssh_keypair:
            path: "/home/{{ remote_regular_user }}/.ssh/id_ed25519.sptaravin-dev.github.{{ remote_regular_user }}"
            type: ed25519
            force: false
            comment: "sptaravin.dev@gmail.com"
            owner: "{{ remote_regular_user }}"
            group: "{{ remote_regular_user }}"
            mode: '0600'

    - name: Create SSH config for GitHub
      ansible.builtin.copy:
        dest: /home/{{ remote_regular_user }}/.ssh/config
        content: |
          Host github.com
              HostName github.com
              User git
              IdentityFile ~/.ssh/id_ed25519.sptaravin-dev.github.{{ remote_regular_user }}
              IdentitiesOnly yes
        owner: "{{ remote_regular_user }}"
        group: "{{ remote_regular_user }}"
        mode: '0600'
      tags: [ssh, github]

    - name: Install Neovim
      block:
        - name: Download latest Neovim tarball
          ansible.builtin.get_url:
            url: https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.tar.gz
            dest: /tmp/nvim-linux-x86_64.tar.gz
            mode: '0644'

        - name: Remove /opt/nvim
          ansible.builtin.command: rm -rf /opt/nvim
          become: true

        - name: Extract Neovim to /opt
          ansible.builtin.unarchive:
            src: /tmp/nvim-linux-x86_64.tar.gz
            dest: /opt
            remote_src: yes
            creates: /opt/nvim
          become: true

        - name: Rename /opt/nvim-linux-x86_64 to /opt/nvim
          ansible.builtin.command: mv /opt/nvim-linux-x86_64 /opt/nvim
          args: 
            creates: /opt/nvim
          become: true
      when: ansible_os_family == "Debian"
      tags: [nvim]
      
    - name: Install Nushell (Debian-based only)
      block:
        - name: Ensure keyring directory exists
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: '0755'
        - name: Download and dearmor the Nushell GPG key
          ansible.builtin.shell: |
            curl -fsSL https://apt.fury.io/nushell/gpg.key | gpg --dearmor -o /etc/apt/keyrings/fury-nushell.gpg
          args:
            creates: /etc/apt/keyrings/fury-nushell.gpg
        - name: Add the Nushell APT repository
          ansible.builtin.apt_repository:
            repo: "deb [signed-by=/etc/apt/keyrings/fury-nushell.gpg] https://apt.fury.io/nushell/ /"
            filename: fury-nushell
            state: present
        - name: Update apt cache after adding Nushell repo
          ansible.builtin.apt:
            update_cache: yes
            cache_valid_time: 3600
        - name: Install Nushell
          ansible.builtin.apt:
            name: nushell
            state: present
      when: ansible_facts['os_family'] == "Debian"
      tags: [nushell]

    - name: Install Starship prompt
      ansible.builtin.shell: |
        curl -sS https://starship.rs/install.sh | sh -s -- -y
      args:
        creates: /usr/local/bin/starship
      tags: [starship]

    - name: Install Go (Debian-based only)
      block:
        - name: Get latest Go version string
          ansible.builtin.uri:
            url: https://go.dev/VERSION?m=text
            return_content: yes
          register: go_version_response

        - name: Set Go version fact without 'go' prefix, only first line
          ansible.builtin.set_fact:
            go_version: "{{ (go_version_response.content.splitlines()[0]) | regex_replace('^go', '') }}"

        - name: Download Go tarball
          ansible.builtin.get_url:
            url: "https://go.dev/dl/go{{ go_version }}.linux-amd64.tar.gz"
            dest: "/tmp/go{{ go_version }}.linux-amd64.tar.gz"
            mode: '0644'

        - name: Remove any existing Go installation
          ansible.builtin.file:
            path: /usr/local/go
            state: absent

        - name: Extract Go tarball to /usr/local
          ansible.builtin.unarchive:
            src: "/tmp/go{{ go_version }}.linux-amd64.tar.gz"
            dest: /usr/local
            remote_src: yes

        - name: Ensure Go bin directory is in system PATH
          ansible.builtin.lineinfile:
            path: /etc/profile.d/go.sh
            create: yes
            line: 'export PATH=$PATH:/usr/local/go/bin'
            state: present
            mode: '0755'

    - name: Install Lazygit (Debian-based only)
      block:
        - name: Get latest Lazygit version
          ansible.builtin.uri:
            url: https://api.github.com/repos/jesseduffield/lazygit/releases/latest
            return_content: true
          register: lazygit_release
        
        - name: Extract Lazygit version
          ansible.builtin.set_fact:
            lazygit_version: "{{ lazygit_release.content | from_json | json_query('tag_name') | regex_replace('^v', '') }}"

        - name: Download Lazygit tarball
          ansible.builtin.get_url:
            url: "https://github.com/jesseduffield/lazygit/releases/download/v{{ lazygit_version }}/lazygit_{{ lazygit_version }}_Linux_x86_64.tar.gz"
            dest: /tmp/lazygit.tar.gz
            mode: '0644'

        - name: Extract Lazygit binary
          ansible.builtin.unarchive:
            src: /tmp/lazygit.tar.gz
            dest: /tmp/
            remote_src: yes
            extra_opts: [--wildcards, "lazygit"]
            creates: /tmp/lazygit

        - name: Install Lazygit to /usr/local/bin
          ansible.builtin.copy:
            src: /tmp/lazygit
            dest: /usr/local/bin/lazygit
            mode: '0755'
            remote_src: yes
      become: true
      tags: [lazygit]

    - name: Install Eza
      shell: |
        wget -qO- https://raw.githubusercontent.com/eza-community/eza/main/deb.asc | gpg --dearmor -o /etc/apt/keyrings/gierens.gpg
        echo "deb [signed-by=/etc/apt/keyrings/gierens.gpg] http://deb.gierens.de stable main" | tee /etc/apt/sources.list.d/gierens.list
        apt update
        apt install -y eza
      when: ansible_os_family == "Debian"
            
    - name: Install Pyenv
      become: false
      become_user: "{{ remote_regular_user }}"
      ansible.builtin.shell: |
        curl -fsSL https://pyenv.run | bash 
      args:
        executable: /bin/bash
        chdir: "/home/{{ remote_regular_user }}"
      tags: [pyenv]

    - name: Install Node 
      block:
        - name: Remove old Node.js if installed
          apt:
            name: nodejs
            state: absent
            purge: yes
          become: yes

        - name: Remove leftover node and npm binaries if present
          file:
            path: "{{ item }}"
            state: absent
          loop:
            - /usr/bin/node
            - /usr/bin/npm
          become: yes

        - name: Add NodeSource Node.js 18 repo setup script
          ansible.builtin.get_url:
            url: https://deb.nodesource.com/setup_18.x
            dest: /tmp/nodesource_setup.sh
            mode: '0755'
          become: yes

        - name: Run NodeSource setup script
          command: bash /tmp/nodesource_setup.sh
          become: yes

        - name: Install Node.js 18
          apt:
            name: nodejs
            state: present
            update_cache: yes
          become: yes

      rescue:
        - name: Fail with message if block fails
          fail:
            msg: "Failed to install Node.js 18"

    - name: Install Terraform from HashiCorp repository
      block:
        - name: Add HashiCorp GPG key
          ansible.builtin.apt_key:
            url: https://apt.releases.hashicorp.com/gpg
            state: present
          become: yes

        - name: Add HashiCorp APT repository (dynamic and correct)
          apt_repository:
            repo: "deb [arch=amd64] https://apt.releases.hashicorp.com {{ ansible_lsb.codename | lower }} main"
            filename: hashicorp
            state: present
          become: yes

        - name: Update APT package index
          ansible.builtin.apt:
            update_cache: yes
          become: yes

        - name: Install Terraform
          ansible.builtin.apt:
            name: terraform
            state: present
          become: yes

      rescue:
        - name: Fail if Terraform installation fails
          ansible.builtin.fail:
            msg: "Terraform installation failed!"

