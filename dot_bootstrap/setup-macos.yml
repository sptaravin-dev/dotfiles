---
- name: Dotfiles Bootstrap Setup for Debian
  hosts: localhost
  become: true
  connection: local
  vars:
    zsh_config_dir: "/home/{{ remote_regular_user }}/.config/zsh"

  tasks:
    - name: Get my user
      ansible.builtin.set_fact:
        remote_regular_user: "{{ ansible_env.SUDO_USER or ansible_user_id }}"

    - name: Install Packages on macOS
      community.general.homebrew:
        name:
          - curl
          - git
          - unzip
          - zsh
          - wget
          - neovim
          - starship
          - eza
        state: present
      when: ansible_facts['os_family'] == "Darwin"
      become: false

    - name: Create SSH key
      block:
        - name: create .ssh directory if needed
          ansible.builtin.file:
            path: /Users/{{ remote_regular_user }}/.ssh
            state: directory
            mode: '0700'
            owner: "{{ remote_regular_user }}"
            group: "staff"

        - name: gen SSH key
          community.crypto.openssh_keypair:
            path: "/Users/{{ remote_regular_user }}/.ssh/id_ed25519.sptaravin-dev.github.{{ remote_regular_user }}"
            type: ed25519
            force: false
            comment: "sptaravin.dev@gmail.com"
            owner: "{{ remote_regular_user }}"
            group: "staff"
            mode: '0600'

        - name: Create SSH config for GitHub
          ansible.builtin.copy:
            dest: /Users/{{ remote_regular_user }}/.ssh/config
            content: |
              Host github.com
                  HostName github.com
                  User git
                  IdentityFile ~/.ssh/id_ed25519.sptaravin-dev.github.{{ remote_regular_user }}
                  IdentitiesOnly yes
            owner: "{{ remote_regular_user }}"
            group: "staff"
            mode: '0600'
      tags: [ssh, github]
