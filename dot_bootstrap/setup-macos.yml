---
- name: Dotfiles Bootstrap Setup for Debian
  hosts: localhost
  become: true
  connection: local
  vars:
    zsh_config_dir: "/home/{{ remote_regular_user }}/.config/zsh"

  tasks:
    - name: Get my user
      ansible.builtin.set_fact:
        remote_regular_user: "{{ ansible_env.SUDO_USER or ansible_user_id }}"

    - name: Install Packages on macOS
      community.general.homebrew:
        name:
          - curl
          - git
          - unzip
          - zsh
          - wget
          - neovim
          - starship
        state: present
      when: ansible_facts['os_family'] == "Darwin"
